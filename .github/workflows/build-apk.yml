name: Gerar APK - Meu Financeiro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Compilar APK
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace --info --console=plain 2>&1 | tee build.log
          status=${PIPESTATUS[0]}

          echo "DIAGNOSTICO DA COMPILACAO"
          tail -n 300 build.log

          echo "## Diagnostico da compilacao" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 300 build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      - name: Verificar APK
        if: success()
        run: |
          echo "Arquivos APK encontrados:"
          find . -type f -name "*.apk" -print

      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Financeiro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
