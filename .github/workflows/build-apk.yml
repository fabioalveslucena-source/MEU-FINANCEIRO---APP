name: Gerar APK - Meu Financeiro

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-24.04

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Instalar componentes Android
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Aceitar licenças Android
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Verificar ambiente
        run: |
          echo "=== JAVA ==="
          java -version

          echo "=== GRADLE ==="
          gradle --version

          echo "=== ANDROID SDK ==="
          sdkmanager --list_installed

      - name: Compilar APK
        run: |
          gradle assembleDebug --stacktrace

            - name: Diagnosticar saída da compilação
        run: |
          echo "=== DIRETÓRIO DO PROJETO ==="
          pwd

          echo "=== ARQUIVOS DO PROJETO ==="
          find . -maxdepth 4 -type f | sort

          echo "=== DIRETÓRIOS BUILD ==="
          find . -type d -name build -print

          echo "=== TODOS OS APKs ==="
          find . -type f -name "*.apk" -print
