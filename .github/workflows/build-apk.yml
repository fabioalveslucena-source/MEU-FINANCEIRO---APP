name: Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Compilar APK e capturar diagnostico
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "INICIO DA COMPILACAO"
          echo "========================================"

          gradle :app:assembleDebug --stacktrace --info --console=plain > build.log 2>&1

          STATUS=$?

          echo ""
          echo "========================================"
          echo "RESULTADO DA COMPILACAO"
          echo "========================================"
          echo "Codigo de saida: $STATUS"

          echo ""
          echo "========================================"
          echo "ULTIMAS 300 LINHAS DO LOG"
          echo "========================================"

          tail -n 300 build.log

          exit $STATUS

      - name: Disponibilizar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-build
          path: build.log
          if-no-files-found: warn

      - name: Verificar APK
        if: always()
        run: |
          echo "Arquivos APK encontrados:"
          find . -type f -name "*.apk" -print

      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Financeiro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
